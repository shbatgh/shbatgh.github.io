    Experience:
      - company: Wei Li Lab, University of Maryland Institute for Health Computing
        position: Undergraduate Research Assistant
        location: North Bethesda, MD
        start_date: 2025-11
        end_date: Present
        summary: Part-time during the academic year; full-time summer 2026.
        highlights:
          - "Built PyTorch pipelines using optimal-transport conditional flow matching to predict RNA-seq profiles from cellular imaging and to learn multimodal representations."
          - "Developed PertFlow-style perturbation prediction code with ESMC perturbation embeddings, cell-type-restricted Sinkhorn OT pairing, MLP and flow-matching heads, and OOD perturbation evaluation."
          - "Reproduced single-cell RNA-seq baselines by adapting open-source pipelines to lab data, running standardized training/inference, and generating comparison predictions."
          - "Implemented LoRA/PEFT fine-tuning for single-cell foundation models, varying rank, target modules, and training schedules to balance accuracy and compute."
          - "Built Perturb-Multimodal data tooling for exact MERFISH/image matching, held-out-batch perturbation benchmarks, and a zstd-sharded cache for roughly 2.2M 18-channel microscopy crops."
      - company: Institut Langevin
        position: Research Intern
        location: Paris, France
        start_date: Jun 2024
        end_date: Aug 2024
        highlights:
          - "Built CNN-based denoising and super-resolution models for corneal nerve microscopy."
          - "Fine-tuned Stable Diffusion 1.5 to generate synthetic microscopy training images and evaluated downstream segmentation/denoising performance using purely artificial data."

    Projects:
      - name: "BioVision: automated 3D visualization of cell behavior"
        url: /projects/biovision/
        summary: Regeneron ISEF 2025 finalist project for quantitative 4D microscopy analysis.
        highlights:
          - "Designed a Python/PyTorch pipeline to segment cells in microscopy videos, track them across slices/timepoints, reconstruct 3D meshes, and export morphology and movement features."
          - "Collaborated with Columbia's Kalderon Lab on Drosophila germarium data, contributing to a co-authored conference abstract."
      - name: Prediction-market arbitrage monitor
        url: /projects/prediction-market-arbitrage/
        summary: Real-time Kalshi/Polymarket arbitrage detector with semantic market matching and user-gated execution.
        highlights:
          - "Standardized roughly 50,000 markets, used embedding retrieval plus Gemini verification for event matching, and streamed live order books over WebSockets."
          - "Computed fee-aware hedged edge, APR, and expected profit with roughly 100 ms quote-to-alert latency; collected 100M+ Polymarket L2 updates for backtesting."
      - name: Autograd engine and neural networks in pure C++
        url: /projects/cpp-autograd/
        summary: Reverse-mode automatic differentiation engine, linear algebra layer, and MLP framework.
        highlights:
          - "Implemented dynamic computational graphs, backward passes for arbitrary DAGs, matrix/vector operations, activations, SGD, and training loops."

